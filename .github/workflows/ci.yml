name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Start infrastructure (MongoDB, LocalStack, Elasticsearch)
        run: docker compose up -d

      - name: Wait for infrastructure to be ready
        run: |
          echo "Waiting for MongoDB..."
          timeout 60 bash -c 'until docker compose exec -T mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 2; done'
          echo "Waiting for LocalStack..."
          timeout 60 bash -c 'until curl -sf http://localhost:4566/_localstack/health >/dev/null; do sleep 2; done'
          # The health endpoint reports ready before infra/localstack/init.sh
          # has finished creating the S3 bucket and SQS queues, so wait for
          # those directly too or the first test run races an empty account.
          echo "Waiting for the S3 bucket..."
          timeout 120 bash -c 'until curl -sf http://localhost:4566/studydocs-pdfs/ >/dev/null; do echo "  not ready yet"; sleep 3; done'
          echo "Waiting for the SQS queue..."
          timeout 60 bash -c 'until curl -sf "http://localhost:4566/?Action=GetQueueUrl&QueueName=studydocs-processing&Version=2012-11-05" | grep -q QueueUrl; do sleep 2; done'
          echo "Waiting for Elasticsearch..."
          timeout 90 bash -c 'until curl -sf http://localhost:9200 >/dev/null; do sleep 2; done'

      - name: Dump LocalStack logs on failure
        if: failure()
        run: docker compose logs localstack

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
